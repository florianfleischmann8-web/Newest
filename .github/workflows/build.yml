name: Build IR Push APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/example/irpush

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'IRPush'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.irpush'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.irpush'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <application android:label="IR Push" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/irpush/MainActivity.kt <<'EOF'
          package com.example.irpush

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.usb.UsbConstants
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbDeviceConnection
          import android.hardware.usb.UsbEndpoint
          import android.hardware.usb.UsbManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private val ACTION = "com.example.irpush.USB_PERMISSION"
              private lateinit var usb: UsbManager
              private lateinit var info: TextView
              private lateinit var hex: EditText
              private var dev: UsbDevice? = null
              private var conn: UsbDeviceConnection? = null
              private var ep: UsbEndpoint? = null
              private val h = Handler(Looper.getMainLooper())
              private val rep = object : Runnable {
                  override fun run() { send(); h.postDelayed(this, 100) }
              }
              private val rcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false)) open()
                      else info.text = "Zugriff verweigert"
                  }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  usb = getSystemService(Context.USB_SERVICE) as UsbManager
                  val f = IntentFilter(ACTION)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rcv, f, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(rcv, f)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 80, 40, 40)
                  info = TextView(this); info.text = "Kein Gerät verbunden"; info.textSize = 16f
                  val scan = Button(this); scan.text = "USB-Gerät suchen"
                  hex = EditText(this); hex.hint = "Hex-Bytes, z.B. 01 A5 3C"
                  val push = Button(this); push.text = "GEDRÜCKT HALTEN = SENDEN"
                  push.textSize = 20f; push.setPadding(0, 80, 0, 80)
                  root.addView(info); root.addView(scan); root.addView(hex); root.addView(push)
                  setContentView(root)

                  scan.setOnClickListener { scanDevice() }
                  push.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> h.post(rep)
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> h.removeCallbacks(rep)
                      }
                      true
                  }
                  scanDevice()
              }

              private fun scanDevice() {
                  val d = usb.deviceList.values.firstOrNull()
                  dev = d
                  if (d == null) { info.text = "Kein USB-Gerät gefunden"; return }
                  if (usb.hasPermission(d)) open()
                  else {
                      val pi = PendingIntent.getBroadcast(
                          this, 0, Intent(ACTION).setPackage(packageName), PendingIntent.FLAG_MUTABLE)
                      usb.requestPermission(d, pi)
                  }
              }

              private fun open() {
                  val d = dev ?: return
                  val c = usb.openDevice(d) ?: run { info.text = "Öffnen fehlgeschlagen"; return }
                  for (n in 0 until d.interfaceCount) {
                      val itf = d.getInterface(n)
                      for (k in 0 until itf.endpointCount) {
                          val e = itf.getEndpoint(k)
                          if (e.direction == UsbConstants.USB_DIR_OUT &&
                              (e.type == UsbConstants.USB_ENDPOINT_XFER_BULK ||
                               e.type == UsbConstants.USB_ENDPOINT_XFER_INT)) {
                              c.claimInterface(itf, true)
                              conn = c; ep = e
                              info.text = "Verbunden: %04X:%04X (%s)".format(d.vendorId, d.productId, d.productName ?: "?")
                              return
                          }
                      }
                  }
                  info.text = "Kein Sende-Endpunkt gefunden: %04X:%04X".format(d.vendorId, d.productId)
              }

              private fun send() {
                  val c = conn ?: return
                  val e = ep ?: return
                  val clean = hex.text.toString().replace(Regex("[^0-9A-Fa-f]"), "")
                  val b = clean.chunked(2).filter { it.length == 2 }.map { it.toInt(16).toByte() }.toByteArray()
                  if (b.isNotEmpty()) c.bulkTransfer(e, b, b.size, 200)
              }

              override fun onDestroy() {
                  h.removeCallbacks(rep)
                  unregisterReceiver(rcv)
                  conn?.close()
                  super.onDestroy()
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IRPush-APK
          path: app/build/outputs/apk/debug/*.apk
