name: Build IR Blaster APK (USB-Erkennung)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK Lizenzen akzeptieren & Pakete installieren
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -iname "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -iname "sdkmanager" -type f 2>/dev/null | head -n 1)
          fi
          echo "Gefundener sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Projektstruktur anlegen
        run: |
          mkdir -p app/src/main/java/com/example/irblaster
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

      - name: settings.gradle schreiben
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IRBlaster"
          include ':app'
          EOF

      - name: Root build.gradle schreiben
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

      - name: app/build.gradle schreiben
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.irblaster'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.irblaster"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

      - name: AndroidManifest.xml schreiben
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.usb.host" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="IR Blaster"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>

          </manifest>
          EOF

      - name: device_filter.xml schreiben (akzeptiert erstmal jedes USB-Gerät)
        run: |
          cat > app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Noch kein bekannter Vendor/Product - erkennt vorerst alles,
                   damit wir die echte Vendor-/Product-ID im Log sehen können. -->
              <usb-device />
          </resources>
          EOF

      - name: strings.xml schreiben
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">IR Blaster</string>
          </resources>
          EOF

      - name: activity_main.xml schreiben
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:paddingBottom="32dp" />

              <Button
                  android:id="@+id/blastButton"
                  android:layout_width="200dp"
                  android:layout_height="200dp"
                  android:text="IR\nSTOSS"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:enabled="false" />

          </LinearLayout>
          EOF

      - name: MainActivity.java schreiben
        run: |
          cat > app/src/main/java/com/example/irblaster/MainActivity.java << 'EOF'
          package com.example.irblaster;

          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import java.util.HashMap;

          public class MainActivity extends AppCompatActivity {

              private static final String ACTION_USB_PERMISSION = "com.example.irblaster.USB_PERMISSION";

              private UsbManager usbManager;
              private UsbDevice connectedDevice;
              private TextView statusText;
              private Button blastButton;

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      String action = intent.getAction();

                      if (UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(action)) {
                          UsbDevice device = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                          if (device != null) {
                              onDeviceFound(device);
                          }
                      } else if (UsbManager.ACTION_USB_DEVICE_DETACHED.equals(action)) {
                          connectedDevice = null;
                          blastButton.setEnabled(false);
                          statusText.setText("USB-Gerät getrennt.");
                      } else if (ACTION_USB_PERMISSION.equals(action)) {
                          synchronized (this) {
                              UsbDevice device = intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                              boolean granted = intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false);
                              if (granted && device != null) {
                                  connectedDevice = device;
                                  blastButton.setEnabled(true);
                                  statusText.setText(describeDevice(device) + "\nZugriff erlaubt. Bereit zum Senden.");
                              } else {
                                  statusText.setText("Zugriff auf USB-Gerät wurde verweigert.");
                              }
                          }
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  blastButton = findViewById(R.id.blastButton);

                  usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  filter.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);
                  filter.addAction(ACTION_USB_PERMISSION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(usbReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(usbReceiver, filter);
                  }

                  statusText.setText("Warte auf USB-C-Gerät ...");
                  checkAlreadyConnectedDevices();

                  blastButton.setOnClickListener(v -> sendPulse());
              }

              // Falls das Gerät schon eingesteckt war, bevor die App gestartet wurde
              private void checkAlreadyConnectedDevices() {
                  HashMap<String, UsbDevice> devices = usbManager.getDeviceList();
                  for (UsbDevice device : devices.values()) {
                      onDeviceFound(device);
                      break;
                  }
              }

              private void onDeviceFound(UsbDevice device) {
                  statusText.setText(describeDevice(device) + "\nFrage um Erlaubnis ...");

                  PendingIntent permissionIntent = PendingIntent.getBroadcast(
                          this, 0, new Intent(ACTION_USB_PERMISSION),
                          PendingIntent.FLAG_IMMUTABLE);

                  usbManager.requestPermission(device, permissionIntent);
              }

              private String describeDevice(UsbDevice device) {
                  return "USB-Gerät erkannt:\n"
                          + "Name: " + device.getDeviceName() + "\n"
                          + "Vendor-ID: " + device.getVendorId() + "\n"
                          + "Product-ID: " + device.getProductId();
              }

              private void sendPulse() {
                  if (connectedDevice == null) {
                      statusText.setText("Kein Gerät verbunden.");
                      return;
                  }

                  // ============================================================
                  // PLATZHALTER: Hier fehlt noch das herstellerspezifische
                  // USB-Protokoll des Dongles. Sobald bekannt ist, welche Bytes
                  // über welchen Endpoint gesendet werden müssen, kommt hier
                  // z.B. ein UsbDeviceConnection.bulkTransfer(...) Aufruf rein.
                  //
                  // Aktuell passiert beim Tippen noch NICHTS am Gerät -
                  // es wird nur bestätigt, dass die Verbindung da ist.
                  // ============================================================
                  statusText.setText(describeDevice(connectedDevice)
                          + "\n\n[Senden noch nicht implementiert - Protokoll unbekannt]");
              }
          }
          EOF

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ir-blaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
