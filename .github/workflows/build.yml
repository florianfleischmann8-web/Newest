name: Build IR Blaster APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (nur damit Actions ein Repo-Kontext hat)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Projektstruktur anlegen
        run: |
          mkdir -p app/src/main/java/com/example/irblaster
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: settings.gradle schreiben
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IRBlaster"
          include ':app'
          EOF

      - name: Root build.gradle schreiben
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

      - name: app/build.gradle schreiben
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.irblaster'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.irblaster"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

      - name: AndroidManifest.xml schreiben
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.consumerir"
                  android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="IR Blaster"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: strings.xml schreiben
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">IR Blaster</string>
          </resources>
          EOF

      - name: activity_main.xml schreiben
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:paddingBottom="32dp" />

              <Button
                  android:id="@+id/blastButton"
                  android:layout_width="200dp"
                  android:layout_height="200dp"
                  android:text="IR\nSTOSS"
                  android:textSize="22sp"
                  android:textStyle="bold" />

          </LinearLayout>
          EOF

      - name: MainActivity.java schreiben
        run: |
          cat > app/src/main/java/com/example/irblaster/MainActivity.java << 'EOF'
          package com.example.irblaster;

          import android.hardware.ConsumerIrManager;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private ConsumerIrManager irManager;
              private TextView statusText;

              private static final int CARRIER_FREQUENCY = 38000;

              private static final int[] PULSE_PATTERN = {
                      9000, 4500,
                      560, 560, 560, 560, 560, 1690,
                      560, 560, 560, 560, 560, 560,
                      560, 39000
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  Button blastButton = findViewById(R.id.blastButton);

                  irManager = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);

                  if (irManager == null || !irManager.hasIrEmitter()) {
                      statusText.setText("Kein eingebauter Infrarot-Sender auf diesem Gerät gefunden.");
                      blastButton.setEnabled(false);
                      return;
                  }

                  statusText.setText("Bereit. Tippe den Button für einen IR-Stoß.");

                  blastButton.setOnClickListener(v -> sendPulse());
              }

              private void sendPulse() {
                  try {
                      irManager.transmit(CARRIER_FREQUENCY, PULSE_PATTERN);
                      statusText.setText("IR-Stoß gesendet (" + System.currentTimeMillis() + ")");
                  } catch (Exception e) {
                      statusText.setText("Fehler beim Senden: " + e.getMessage());
                      Toast.makeText(this, "Senden fehlgeschlagen", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ir-blaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
